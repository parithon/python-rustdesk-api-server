version: "3.8"
services:
  rustdesk-api-server:
    container_name: rustdesk-api-server
    build:
      context: .
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:21114
      - DatabaseType=SQLITE
      - AllowRegistration=true
      - TokenSalt=your_custom_salt_here
    volumes:
      - /yourpath/db:/app/db
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    network_mode: bridge
    ports:
      - "21114:21114"
    restart: unless-stopped

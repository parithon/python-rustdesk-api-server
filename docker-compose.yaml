version: "3.8"
services:
  rustdesk-api-server:
    container_name: rustdesk-api-server
    build:
      context: .
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:21114
      - TZ=UTC
      # Set to MYSQL to use MySQL instead of SQLite
      - DatabaseType=SQLITE
      # MySQL settings (only used when DatabaseType=MYSQL)
      # - MySql__Host=127.0.0.1
      # - MySql__Port=3306
      # - MySql__Database=rustdesk
      # - MySql__User=rustdesk
      # - MySql__Password=yourpassword
      # Allow new user registration (true/false)
      - AllowRegistration=true
      # Optional: set to your server's public IP/hostname for the web client
      # - IdServer=yourdomain.com
    volumes:
      - /yourpath/db:/app/db
    network_mode: bridge
    ports:
      - "21114:21114"
    restart: unless-stopped
